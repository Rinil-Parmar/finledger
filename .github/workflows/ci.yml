name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        # Testcontainers spins up a real PostgreSQL container; the ubuntu-latest
        # runner has Docker available, so integration tests run for real in CI.
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify
