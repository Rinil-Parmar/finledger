spring:
  application:
    name: finledger

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/finledger}
    username: ${DB_USER:finledger}
    password: ${DB_PASSWORD:finledger}

  jpa:
    # Flyway owns the schema. Hibernate is NOT allowed to create or alter tables;
    # it only validates that our entities match the migrated schema at startup.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: finledger
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# FinLedger-specific settings.
finledger:
  outbox:
    topic: finledger.events
    # How often the publisher drains PENDING outbox rows to Kafka.
    poll-interval-ms: 1000
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
