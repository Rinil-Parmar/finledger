# Local development infrastructure for FinLedger.
# Start with:  docker compose up -d
# Stop with:   docker compose down        (add -v to also wipe the data volume)
#
# Credentials here are for LOCAL DEV ONLY. Real secrets never live in this file.
services:
  postgres:
    image: postgres:16
    container_name: finledger-postgres
    environment:
      POSTGRES_DB: finledger
      POSTGRES_USER: finledger
      POSTGRES_PASSWORD: finledger
    ports:
      # Host port 5433 to avoid clashing with a native PostgreSQL on 5432.
      # Inside the container Postgres still listens on 5432.
      - "5433:5432"
    volumes:
      - finledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finledger -d finledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Single-node Kafka in KRaft mode (no ZooKeeper). Advertises localhost:9092 so the
  # app running on the host can reach it.
  kafka:
    image: apache/kafka:3.8.1
    container_name: finledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  finledger-pgdata:
